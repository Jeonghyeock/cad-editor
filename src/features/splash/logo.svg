<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <radialGradient id="glow" cx="512" cy="400" r="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- squircle background -->
  <rect x="0" y="0" width="1024" height="1024" rx="228" ry="228" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="228" ry="228" fill="url(#glow)"/>

  <!-- isometric cube: p1 top, p2 top-right, p3 bottom-right, p4 bottom, p5 bottom-left, p6 top-left, c center -->
  <!-- top face (active sketch plane) -->
  <polygon points="262,367 512,222 762,367 512,512" fill="#22d3ee" fill-opacity="0.16"/>

  <!-- cube wireframe: outer hexagon + 3 inner edges to center -->
  <g fill="none" stroke="#e2e8f0" stroke-width="16" stroke-linejoin="round" stroke-linecap="round">
    <polygon points="512,222 762,367 762,657 512,802 262,657 262,367"/>
    <path d="M512,222 L512,512 M762,367 L512,512 M262,367 L512,512"/>
  </g>

  <!-- sketch nodes (constraint/vertex points) -->
  <g fill="#22d3ee" stroke="#0b1220" stroke-width="6">
    <circle cx="512" cy="222" r="30"/>
    <circle cx="512" cy="512" r="24"/>
    <circle cx="262" cy="367" r="20"/>
    <circle cx="762" cy="367" r="20"/>
  </g>
</svg>
